<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
  <head>
    <title>Title</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="./../css/style.css" />
    <!-- Bootstrap CSS v5.3.8 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>

  <body>
    <header>
      <div class="container">
        <div class="timer-box">
          <h1>⏰ Đồng hồ đếm ngược</h1>

          <p>Thời gian còn lại</p>

          <!-- Hiển thị thời gian -->
          <div id="timer" class="timer">10:00</div>

          <!-- Nút điều khiển -->
          <div class="buttons">
            <button id="startButton">Bắt đầu</button>

            <button id="pauseButton">Tạm dừng</button>

            <button id="resetButton">Đặt lại</button>
          </div>
        </div>
      </div>

      <!-- MODAL -->
      <div id="modal" class="modal">
        <div class="modal-content">
          <h2>⏰ Hết thời gian!</h2>

          <p>Thời gian đếm ngược đã kết thúc.</p>

          <button id="closeModal">Đóng</button>
        </div>
      </div>
    </header>
    <main></main>
    <footer>
      <!-- place footer here -->
    </footer>
    <!-- Bootstrap JavaScript Bundle (includes Popper) -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="./../js/script.js"></script>
  </body>
</html>
